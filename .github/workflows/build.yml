name: Build Warp Go TV Ultra Test 1 v7a

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 26.3.11579264
      VERSION_NAME: 0.1.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Warp Go TV Ultra Test 1 source
        run: |
          set -e
          unzip -q Warp-Go-TV-Ultra-Test1-v7a-source.zip
          test -d warp-go-tv-ultra-test1/gui

      - name: Install Linux dependencies for Wails CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare preinstalled Android SDK
        run: |
          set -e
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${{ env.NDK_VERSION }}" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Set up Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
          cache-dependency-path: warp-go-tv-ultra-test1/gui/go.sum

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: warp-go-tv-ultra-test1/gui/frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prepare Go modules
        working-directory: warp-go-tv-ultra-test1/gui
        run: go mod tidy

      - name: Generate Android overlay
        working-directory: warp-go-tv-ultra-test1/gui
        run: wails3 android overlay:gen -out build/android/overlay.json -config build/config.yml

      - name: Generate Wails bindings
        working-directory: warp-go-tv-ultra-test1/gui
        run: wails3 generate bindings -ts -f '-tags android' -clean=true

      - name: Build frontend
        working-directory: warp-go-tv-ultra-test1/gui/frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Download GEO databases
        working-directory: warp-go-tv-ultra-test1/gui/build/android/app/src/main
        run: |
          mkdir -p assets/geo
          for f in geosite.dat geoip-lite.dat; do
            [ -s "assets/geo/$f" ] && continue
            if curl -fL --retry 3 --connect-timeout 20 \
              -o "assets/geo/$f" \
              "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/$f"; then
              echo "Downloaded $f"
            else
              echo "Warning: $f download failed; runtime fallback will be used."
              rm -f "assets/geo/$f"
            fi
          done

      - name: Build Go JNI core for armeabi-v7a
        working-directory: warp-go-tv-ultra-test1/gui
        env:
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
          CXX: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm
          GOARM: '7'
        run: |
          set -e
          mkdir -p build/android/app/src/main/jniLibs/armeabi-v7a
          go build -buildmode=c-shared -overlay build/android/overlay.json \
            -tags production,android,with_gvisor -trimpath -buildvcs=false \
            -ldflags="-w -s -X main.version=${VERSION_NAME}" \
            -o build/android/app/src/main/jniLibs/armeabi-v7a/libwails.so

      - name: Verify Ultra v7a-only configuration
        working-directory: warp-go-tv-ultra-test1
        run: |
          set -e
          grep -q "abiFilters 'armeabi-v7a'" gui/build/android/app/build.gradle
          grep -q 'applicationId "com.callacat.warpgo.ultra.test"' gui/build/android/app/build.gradle
          grep -q 'Warp Go TV Ultra Test 1' gui/build/android/app/src/main/res/values/strings.xml
          test -s gui/build/android/app/src/main/jniLibs/armeabi-v7a/libwails.so
          test ! -d gui/build/android/app/src/main/jniLibs/arm64-v8a
          test ! -d gui/build/android/app/src/main/jniLibs/x86_64

      - name: Build debug APK
        working-directory: warp-go-tv-ultra-test1/gui/build/android
        run: |
          chmod +x gradlew
          VERSION_NAME="${VERSION_NAME}" ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp warp-go-tv-ultra-test1/gui/build/android/app/build/outputs/apk/debug/app-debug.apk \
             out/Warp-Go-TV-Ultra-Test1-v7a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Go-TV-Ultra-Test1-v7a
          path: out/Warp-Go-TV-Ultra-Test1-v7a.apk
          if-no-files-found: error
