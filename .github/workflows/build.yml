name: Build Warp Go TV MASQUE

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 26.3.11579264

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q Warp-Go-TV-MASQUE-stage3-source.zip
          echo "PROJECT_DIR=warp-go-masque-backup-main" >> "$GITHUB_ENV"
          sed -i '/const MODES:/d' warp-go-masque-backup-main/gui/frontend/src/lib/theme.ts

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${{ env.NDK_VERSION }}"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prepare Go dependencies
        working-directory: ${{ env.PROJECT_DIR }}/gui
        run: go mod tidy

      - name: Generate Android overlay
        working-directory: ${{ env.PROJECT_DIR }}/gui
        run: |
          wails3 android overlay:gen \
            -out build/android/overlay.json \
            -config build/config.yml

      - name: Generate Wails bindings
        working-directory: ${{ env.PROJECT_DIR }}/gui
        run: |
          wails3 generate bindings -ts -f '-tags android' -clean=true

      - name: Build frontend
        working-directory: ${{ env.PROJECT_DIR }}/gui/frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Build armeabi-v7a library
        working-directory: ${{ env.PROJECT_DIR }}/gui
        env:
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm
          GOARM: '7'
        run: |
          mkdir -p build/android/app/src/main/jniLibs/armeabi-v7a

          go build \
            -buildmode=c-shared \
            -overlay build/android/overlay.json \
            -tags production,android,with_gvisor \
            -trimpath \
            -buildvcs=false \
            -ldflags="-w -s" \
            -o build/android/app/src/main/jniLibs/armeabi-v7a/libwails.so

      - name: Build arm64-v8a library
        working-directory: ${{ env.PROJECT_DIR }}/gui
        env:
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
        run: |
          mkdir -p build/android/app/src/main/jniLibs/arm64-v8a

          go build \
            -buildmode=c-shared \
            -overlay build/android/overlay.json \
            -tags production,android,with_gvisor \
            -trimpath \
            -buildvcs=false \
            -ldflags="-w -s" \
            -o build/android/app/src/main/jniLibs/arm64-v8a/libwails.so

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}/gui/build/android
        run: |
          chmod +x ./gradlew
          VERSION_NAME=1.1 ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp \
            "${{ env.PROJECT_DIR }}/gui/build/android/app/build/outputs/apk/release/app-release.apk" \
            "${{ env.PROJECT_DIR }}/gui/build/android/app/build/outputs/apk/release/Warp-TV-Ultra-Stage3.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warp-TV-Ultra-Stage2
          path: |
            ${{ env.PROJECT_DIR }}/gui/build/android/app/build/outputs/apk/release/Warp-TV-Ultra-Stage3.apk
          if-no-files-found: error
